name = "life-vault-backend"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Cloudflare D1 database linked to this Worker.
# The ID is a resource identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "lifevault-db"
database_id = "feb621fc-0c24-4c31-b52e-ce357ef31b40"

# Optional media storage (requires separate creation and configuration):
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "lifevault-media"

[vars]
APP_ORIGIN = "https://life-vault-c3b.pages.dev"
